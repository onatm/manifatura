[package]
name = "manifatura-tools"
description = "The basic tools for manifatura (read, edit, grep, glob, bash) and the env on this machine."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
documentation = "https://docs.rs/manifatura-tools"

[features]
default = ["local"]
# `local`: `Local`, the environment on this machine.
local = ["dep:libc", "tokio/fs", "tokio/process", "tokio/io-util"]

[dependencies]
async-trait.workspace = true
globset = { version = "0.4.20", default-features = false }
ignore = "0.4.33"
libc = { version = "0.2", optional = true }
manifatura-agent.workspace = true
regex = { version = "1.13.1", default-features = false, features = ["std", "unicode-perl", "unicode-case"] }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
