[package]
name = "manifatura-mcp"
description = "MCP servers' tools for manifatura, over stdio or streamable HTTP."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
documentation = "https://docs.rs/manifatura-mcp"

[dependencies]
manifatura-agent.workspace = true
reqwest.workspace = true
rmcp = { version = "3.11.0", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "reqwest-tls-no-provider"] }
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time", "macros", "process", "io-util"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "io-util"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
