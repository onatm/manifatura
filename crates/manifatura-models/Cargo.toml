[package]
name = "manifatura-models"
description = "Model providers for manifatura: llama.cpp and other OpenAI-compatible servers."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
documentation = "https://docs.rs/manifatura-models"

[features]
default = ["openai"]
openai = []

[dependencies]
futures-util.workspace = true
manifatura-agent.workspace = true
reqwest.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "net", "io-util"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
