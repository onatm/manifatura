[package]
name = "rho"
description = "rho: a coding agent in the terminal, on manifatura and your ChatGPT plan."
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[dependencies]
anyhow = "1.0.100"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.9", features = ["derive"] }
crossterm = "0.29.0"
futures-util.workspace = true
ignore = "0.4.33"
manifatura = { workspace = true, features = ["auth", "exec", "kit", "mcp", "policy", "sandbox", "skills", "snapshots", "store-jsonl", "subagents", "tools"] }
nucleo-matcher = "0.3.1"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
ratatui-crossterm = { version = "0.1.2", default-features = false, features = ["scrolling-regions"] }
ratatui-textarea = "0.9.4"
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
strip-ansi-escapes = "0.2.1"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }
toml = { version = "1.1.8", default-features = false, features = ["parse", "display", "serde", "std"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tui-markdown = { version = "0.3.13", default-features = false }
unicode-width = "0.2"
