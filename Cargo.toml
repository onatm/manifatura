[workspace]
resolver = "3"
members = [
    "crates/manifatura",
    "crates/manifatura-agent",
    "crates/manifatura-kit",
    "crates/manifatura-mcp",
    "crates/manifatura-models",
    "crates/manifatura-skills",
    "crates/manifatura-store",
    "crates/manifatura-subagents",
    "crates/manifatura-tools",
    "examples",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.91"
license = "MIT"
repository = "https://github.com/onatm/manifatura"
homepage = "https://manifatura.dev"
keywords = ["agent", "llm", "ai", "tools", "hooks"]
categories = ["asynchronous", "development-tools"]

[workspace.dependencies]
manifatura = { version = "0.3.0", path = "crates/manifatura" }
manifatura-agent = { version = "0.3.0", path = "crates/manifatura-agent" }
manifatura-kit = { version = "0.3.0", path = "crates/manifatura-kit" }
manifatura-mcp = { version = "0.3.0", path = "crates/manifatura-mcp" }
manifatura-models = { version = "0.3.0", path = "crates/manifatura-models", default-features = false }
manifatura-skills = { version = "0.3.0", path = "crates/manifatura-skills" }
manifatura-store = { version = "0.3.0", path = "crates/manifatura-store" }
manifatura-subagents = { version = "0.3.0", path = "crates/manifatura-subagents" }
manifatura-tools = { version = "0.3.0", path = "crates/manifatura-tools" }
async-trait = "0.1.92"
futures-util = { version = "0.3.34", default-features = false, features = ["std", "alloc"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "stream"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_norway = "0.9.42"
tokio = { version = "1.53.3", default-features = false }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
